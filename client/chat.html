<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>患者服务台 · 康宁健康</title>
  <style>
    :root{
      --bg:#eef2f6; --surface:#ffffff; --ink:#1f2a37; --muted:#64748b;
      --line:#e2e8f0; --primary:#0d9488; --primary-700:#0f766e; --primary-50:#f0fdfa;
      --danger:#dc2626; --danger-50:#fef2f2; --amber:#d97706; --amber-50:#fffbeb;
      --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
      --radius:14px;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      font-size:14px;line-height:1.6;
    }
    button{font-family:inherit;cursor:pointer;}
    .icon{width:20px;height:20px;flex:none;}

    /* 顶栏 */
    .topbar{
      height:60px;background:var(--surface);border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;padding:0 20px;
      position:sticky;top:0;z-index:20;
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;}
    .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--primary-50);
      display:flex;align-items:center;justify-content:center;color:var(--primary-700);}
    .brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);}
    .userbox{display:flex;align-items:center;gap:12px;}
    .userbox .who{text-align:right;}
    .userbox .who b{font-size:13px;}
    .userbox .who span{display:block;font-size:11px;color:var(--muted);}
    .avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;
      display:flex;align-items:center;justify-content:center;font-weight:700;}
    .btn-ghost{border:1px solid var(--line);background:#fff;color:var(--muted);
      padding:7px 12px;border-radius:9px;font-size:13px;}
    .btn-ghost:hover{color:var(--ink);border-color:#cbd5e1;}

    /* 多账号切换 */
    .acct-wrap{position:relative;}
    .acct-menu{position:absolute;top:42px;right:0;min-width:170px;background:#fff;border:1px solid var(--line);
      border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.12);padding:6px;z-index:50;}
    .acct-item{padding:9px 12px;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer;}
    .acct-item:hover{background:var(--primary-50);}
    .acct-item.active{color:var(--primary-700);font-weight:600;}
    .acct-item.add{border-top:1px solid var(--line);margin-top:4px;color:var(--primary-600);}

    /* 布局 */
    .layout{display:flex;min-height:calc(100vh - 60px);}
    .sidenav{width:240px;flex:none;background:var(--surface);border-right:1px solid var(--line);
      padding:16px 12px;display:flex;flex-direction:column;}
    .nav-title{font-size:11px;color:var(--muted);letter-spacing:.08em;padding:4px 10px 8px;}
    .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
      color:#334155;text-decoration:none;font-size:14px;margin-bottom:4px;border:1px solid transparent;}
    .nav-item .icon{color:var(--muted);}
    .nav-item:hover{background:#f8fafc;}
    .nav-item.active{background:var(--primary-50);color:var(--primary-700);border-color:#cdeae5;font-weight:600;}
    .nav-item.active .icon{color:var(--primary-700);}
    .nav-item.danger{color:var(--danger);}
    .nav-item.danger .icon{color:var(--danger);}
    .nav-item.danger:hover{background:var(--danger-50);}
    .nav-item.danger.active{background:var(--danger-50);border-color:#fecaca;color:var(--danger);}
    .side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:12px 10px 4px;
      border-top:1px solid var(--line);line-height:1.8;}

    /* 主区 */
    .content{flex:1;display:flex;flex-direction:column;max-width:960px;margin:0 auto;width:100%;padding:18px 22px 0;}
    .svc-head h2{margin:0 0 4px;font-size:18px;}
    .svc-head p{margin:0;color:var(--muted);font-size:13px;}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px;}
    .chip{border:1px solid var(--line);background:#fff;color:#475569;padding:7px 13px;border-radius:999px;
      font-size:13px;transition:.15s;}
    .chip:hover{border-color:var(--primary);color:var(--primary-700);background:var(--primary-50);}

    /* 数据面板（真实业务数据展示） */
    .data-panel{margin:6px 0 4px;}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      padding:16px 18px;box-shadow:var(--shadow);}
    .panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
    .panel-h>span:first-child{font-weight:700;font-size:15px;}
    .panel-sub{font-size:12px;color:var(--muted);}
    .panel-loading,.empty{color:var(--muted);font-size:13px;padding:8px 2px;}

    .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
    .slot-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.15s;background:#fff;}
    .slot-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(13,148,136,.12);}
    .slot-card.disabled{opacity:.6;cursor:not-allowed;}
    .slot-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
    .slot-top b{font-size:15px;}
    .period{font-size:12px;color:var(--primary-700);background:var(--primary-50);padding:2px 9px;border-radius:999px;}
    .slot-doc{font-size:12px;color:var(--muted);margin-bottom:10px;}
    .slot-foot{display:flex;justify-content:space-between;align-items:center;}
    .remain{font-size:13px;font-weight:600;color:#0f766e;}
    .remain.full{color:var(--muted);}
    .tag-full{font-size:12px;color:var(--muted);}
    .book-btn{font-size:13px;color:var(--primary-700);font-weight:600;}

    .report-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
    .report-card{border:1px solid var(--line);border-left:3px solid #cbd5e1;border-radius:12px;padding:12px 14px;background:#fff;}
    .report-card.abnormal{border-left-color:var(--danger);background:var(--danger-50);}
    .rc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .rc-top b{font-size:14px;}
    .badge-abn{font-size:11px;color:#fff;background:var(--danger);padding:1px 8px;border-radius:999px;}
    .badge-ok{font-size:11px;color:#0f766e;background:var(--primary-50);padding:1px 8px;border-radius:999px;}
    .rc-val{font-size:16px;font-weight:700;}
    .rc-meta{font-size:12px;color:var(--muted);margin:3px 0 8px;}
    .link-btn{border:none;background:none;color:var(--primary-700);font-size:13px;padding:0;cursor:pointer;font-weight:600;}

    .vital-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
    .vital-card{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fff;}
    .v-name{font-size:12px;color:var(--muted);}
    .v-val{font-size:20px;font-weight:700;margin:4px 0;color:var(--primary-700);}
    .v-unit{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px;}
    .v-time{font-size:11px;color:var(--muted);}
    .rem-h{font-weight:700;font-size:14px;margin:6px 0 8px;}
    .rem-list{display:flex;flex-direction:column;gap:8px;}
    .rem-item{display:flex;gap:10px;align-items:flex-start;}
    .rem-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:none;}
    .rem-body{font-size:13px;}
    .rem-meta{font-size:11px;color:var(--muted);}

    .dept-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
    .dept-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;}
    .dept-card b{font-size:14px;}
    .dept-card span{display:block;font-size:12px;color:var(--muted);margin:4px 0 8px;}

    /* 体检详细流程报表 */
    .flow-summary{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
    .flow-stat{background:var(--primary-50);border:1px solid #cdeae5;border-radius:12px;padding:10px 18px;font-size:12px;color:var(--primary-700);text-align:center;}
    .flow-stat b{font-size:22px;display:block;color:#0f766e;line-height:1.2;}
    .flow-path{background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;margin-bottom:18px;font-size:13px;color:#475569;line-height:1.7;}
    .flow-path b{color:var(--ink);}
    .flow-list{position:relative;}
    .flow-step{display:flex;gap:14px;padding:0 0 18px 0;position:relative;}
    .flow-step:last-child{padding-bottom:4px;}
    .flow-rail{display:flex;flex-direction:column;align-items:center;flex:none;}
    .flow-dot{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;z-index:1;}
    .flow-step.done .flow-dot{background:var(--muted);}
    .flow-line{width:2px;flex:1;background:var(--line);margin-top:4px;}
    .flow-step:last-child .flow-line{display:none;}
    .flow-body{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);}
    .flow-step.done .flow-body{opacity:.72;}
    .flow-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .flow-name{font-size:15px;font-weight:700;}
    .flow-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:auto;}
    .flow-badge.todo{background:var(--amber-50);color:var(--amber);border:1px solid #fde68a;}
    .flow-badge.done{background:var(--primary-50);color:var(--primary-700);border:1px solid #cdeae5;}
    .flow-loc{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#0f766e;background:var(--primary-50);padding:4px 11px;border-radius:8px;margin-bottom:6px;}
    .flow-note{font-size:12.5px;color:var(--muted);}
    .flow-meta{font-size:11px;color:var(--muted);margin-top:5px;}

    .chat{flex:1;overflow-y:auto;padding:14px 4px 8px;display:flex;flex-direction:column;gap:14px;}
    .msg{display:flex;gap:10px;max-width:78%;}
    .msg .ava{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;
      justify-content:center;font-size:12px;font-weight:700;color:#fff;}
    .msg.user{align-self:flex-end;flex-direction:row-reverse;}
    .msg.user .ava{background:var(--primary);}
    .msg.bot .ava{background:#94a3b8;}
    .bubble{padding:11px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word;}
    .msg.user .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
    .msg.bot .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;}
    .bubble .who{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;}
    .typing{display:inline-flex;gap:4px;padding:4px 2px;}
    .typing i{width:6px;height:6px;border-radius:50%;background:#94a3b8;animation:blink 1.2s infinite;}
    .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

    .banner{display:flex;gap:12px;align-items:flex-start;background:var(--amber-50);
      border:1px solid #fde68a;border-radius:12px;padding:13px 15px;font-size:13px;}
    .banner .bi{color:var(--amber);flex:none;margin-top:1px;}
    .banner b{color:#92400e;}
    .banner .aid{font-family:ui-monospace,Menlo,monospace;background:#fff;border:1px solid #fde68a;
      padding:1px 7px;border-radius:6px;color:#92400e;}

    /* 预约成功卡（自动执行，无需审批） */
    .ok-card{display:flex;gap:12px;align-items:flex-start;background:var(--primary-50);
      border:1px solid #cdeae5;border-radius:12px;padding:13px 15px;font-size:13px;}
    .ok-card .oci{color:#0d9488;flex:none;margin-top:1px;}
    .ok-card b{color:#0f766e;}
    .ok-card .ok-detail{font-size:12px;color:var(--muted);margin-top:4px;}

    /* 会话切换提示 */
    .switch-tip{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 4px;
      letter-spacing:.02em;}

    .composer{border-top:1px solid var(--line);background:var(--surface);padding:14px 4px 18px;
      display:flex;gap:10px;align-items:flex-end;}
    .composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;
      padding:11px 14px;font-size:14px;font-family:inherit;line-height:1.5;max-height:120px;outline:none;}
    .composer textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50);}
    .send{background:var(--primary);color:#fff;border:none;padding:11px 22px;border-radius:12px;
      font-size:14px;font-weight:600;flex:none;}
    .send:hover{background:var(--primary-700);}
    .send:disabled{opacity:.55;cursor:not-allowed;}
    .hint{font-size:11px;color:var(--muted);text-align:center;padding:0 4px 12px;}

    /* 登录遮罩 */
    .mask{position:fixed;inset:0;background:#eef2f6;display:flex;align-items:center;justify-content:center;z-index:50;}
    .login-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
      width:360px;max-width:90vw;padding:28px 26px;}
    .login-card h3{margin:0 0 4px;font-size:18px;}
    .login-card p{margin:0 0 18px;color:var(--muted);font-size:13px;}
    .field{margin-bottom:13px;}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
    .field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;
      font-family:inherit;outline:none;}
    .field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50);}
    .login-card .send{width:100%;}
    .alt{margin-top:12px;font-size:12px;color:var(--muted);text-align:center;}
    .alt a{color:var(--primary-700);cursor:pointer;}
    .err{color:var(--danger);font-size:12px;min-height:16px;margin-top:6px;}

    @media(max-width:760px){
      .sidenav{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px;}
      .nav-title,.side-foot{display:none;}
      .nav-item{margin:0 4px 0 0;white-space:nowrap;}
      .layout{flex-direction:column;}
      .content{padding:14px;}
      .msg{max-width:90%;}
    }

    /* 知情同意强制弹窗（Tier-0 法律责任红线） */
    .consent-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:80;}
    .consent-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.25);width:460px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column;}
    .consent-card h3{margin:0;padding:20px 24px 6px;font-size:17px;}
    .consent-card .sub{padding:0 24px 10px;color:var(--muted);font-size:13px;}
    .consent-body{overflow-y:auto;padding:4px 24px 12px;font-size:13px;line-height:1.75;color:#334155;white-space:pre-wrap;}
    .consent-foot{padding:14px 24px 20px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;}
    .consent-foot .chk{display:flex;align-items:center;gap:8px;font-size:13px;flex:1;cursor:pointer;}
    .consent-foot .send{background:var(--primary);color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:14px;font-weight:600;flex:none;}
    .consent-foot .send:disabled{opacity:.5;cursor:not-allowed;}

    /* 紧急救助 / 范围说明 气泡（硬闸渲染） */
    .msg.bot.emergency .bubble{background:var(--danger-50);border:1px solid #fecaca;}
    .msg.bot.emergency .bubble .who{color:var(--danger);}
    .msg.bot.scope .bubble{background:var(--amber-50);border:1px solid #fde68a;}
    .msg.bot.scope .bubble .who{color:#92400e;}
    .disclaimer-note{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.5;}
    .trace-note{margin-top:6px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-wrap:wrap;}
    .trace-note .trace-label{opacity:.75;}
    .trace-note .trace-id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--line-2, #f1f3f5);padding:1px 6px;border-radius:4px;color:var(--ink-2, #4b5563);user-select:all;}
    .trace-note .trace-copy{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:10.5px;padding:1px 7px;border-radius:4px;cursor:pointer;}
    .trace-note .trace-copy:hover{border-color:var(--brand, #2563eb);color:var(--brand, #2563eb);}
  </style>
</head>
<body>

  <!-- 登录遮罩 -->
  <div class="mask" id="loginMask">
    <div class="login-card">
      <h3>康宁健康 · 患者服务台</h3>
      <p>登录后即可使用智能分诊、预约挂号、报告解读等服务</p>

      <!-- 登录表单 -->
      <div id="loginForm">
        <div class="field">
          <label>手机号 / 用户名</label>
          <input id="lu" value="alice" autocomplete="username" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="lp" type="password" value="alice123" autocomplete="current-password" />
        </div>
        <button class="send" data-action="login">登录</button>
        <div class="err" id="lerr"></div>
        <div class="alt" data-action="show-register">还没有账号？<a>立即注册 ›</a></div>
      </div>

      <!-- 注册表单 -->
      <div id="regForm" style="display:none">
        <div class="field">
          <label>用户名（用于登录的唯一账号）</label>
          <input id="ru" placeholder="3-32 位字母/数字/下划线" autocomplete="username" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="rp" type="password" placeholder="至少 6 位" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>确认密码</label>
          <input id="rp2" type="password" placeholder="再次输入密码" autocomplete="new-password" />
        </div>
        <button class="send" data-action="register">注册并登录</button>
        <div class="err" id="rerr"></div>
        <div class="alt" data-action="show-login">已有账号？<a>去登录 ›</a></div>
      </div>

      <div class="alt" style="margin-top:10px">医护人员请前往 <a data-action="go-review">医护工作台 →</a></div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 5.65-7 10-7 10Z"/><path d="M5 12h3l2-3 2 5 2-3h3"/></svg>
      </div>
      <div>康宁健康<small>智慧医疗服务台</small></div>
    </div>
    <div class="userbox" id="userbox" style="display:none">
      <div class="who"><b id="uname">—</b><span>患者</span></div>
      <div class="avatar" id="uava">—</div>
      <div class="acct-wrap">
        <button class="btn-ghost" data-action="toggle-acct-menu">切换 ▾</button>
        <div class="acct-menu" id="acctMenu" style="display:none"></div>
      </div>
      <button class="btn-ghost" data-action="logout">退出</button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧服务导航：对应链路图 5 大子 Agent -->
    <aside class="sidenav">
      <div class="nav-title">就医服务</div>
      <a class="nav-item active" data-svc="home">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
        健康咨询
      </a>
      <a class="nav-item" data-svc="triage">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></svg>
        智能分诊
      </a>
      <a class="nav-item" data-svc="booking">
