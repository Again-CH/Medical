<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>患者服务台 · 康宁健康</title>
  <style>
    :root{
      --bg:#eef2f6; --surface:#ffffff; --ink:#1f2a37; --muted:#64748b;
      --line:#e2e8f0; --primary:#0d9488; --primary-700:#0f766e; --primary-50:#f0fdfa;
      --danger:#dc2626; --danger-50:#fef2f2; --amber:#d97706; --amber-50:#fffbeb;
      --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
      --radius:14px;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      font-size:14px;line-height:1.6;
    }
    button{font-family:inherit;cursor:pointer;}
    .icon{width:20px;height:20px;flex:none;}

    /* 顶栏 */
    .topbar{
      height:60px;background:var(--surface);border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;padding:0 20px;
      position:sticky;top:0;z-index:20;
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;}
    .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--primary-50);
      display:flex;align-items:center;justify-content:center;color:var(--primary-700);}
    .brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);}
    .userbox{display:flex;align-items:center;gap:12px;}
    .userbox .who{text-align:right;}
    .userbox .who b{font-size:13px;}
    .userbox .who span{display:block;font-size:11px;color:var(--muted);}
    .avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;
      display:flex;align-items:center;justify-content:center;font-weight:700;}
    .btn-ghost{border:1px solid var(--line);background:#fff;color:var(--muted);
      padding:7px 12px;border-radius:9px;font-size:13px;}
    .btn-ghost:hover{color:var(--ink);border-color:#cbd5e1;}

    /* 多账号切换 */
    .acct-wrap{position:relative;}
    .acct-menu{position:absolute;top:42px;right:0;min-width:170px;background:#fff;border:1px solid var(--line);
      border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.12);padding:6px;z-index:50;}
    .acct-item{padding:9px 12px;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer;}
    .acct-item:hover{background:var(--primary-50);}
    .acct-item.active{color:var(--primary-700);font-weight:600;}
    .acct-item.add{border-top:1px solid var(--line);margin-top:4px;color:var(--primary-600);}

    /* 布局 */
    .layout{display:flex;min-height:calc(100vh - 60px);}
    .sidenav{width:240px;flex:none;background:var(--surface);border-right:1px solid var(--line);
      padding:16px 12px;display:flex;flex-direction:column;}
    .nav-title{font-size:11px;color:var(--muted);letter-spacing:.08em;padding:4px 10px 8px;}
    .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
      color:#334155;text-decoration:none;font-size:14px;margin-bottom:4px;border:1px solid transparent;}
    .nav-item .icon{color:var(--muted);}
    .nav-item:hover{background:#f8fafc;}
    .nav-item.active{background:var(--primary-50);color:var(--primary-700);border-color:#cdeae5;font-weight:600;}
    .nav-item.active .icon{color:var(--primary-700);}
    .nav-item.danger{color:var(--danger);}
    .nav-item.danger .icon{color:var(--danger);}
    .nav-item.danger:hover{background:var(--danger-50);}
    .nav-item.danger.active{background:var(--danger-50);border-color:#fecaca;color:var(--danger);}
    .side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:12px 10px 4px;
      border-top:1px solid var(--line);line-height:1.8;}

    /* 主区 */
    .content{flex:1;display:flex;flex-direction:column;max-width:960px;margin:0 auto;width:100%;padding:18px 22px 0;}
    .svc-head h2{margin:0 0 4px;font-size:18px;}
    .svc-head p{margin:0;color:var(--muted);font-size:13px;}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px;}
    .chip{border:1px solid var(--line);background:#fff;color:#475569;padding:7px 13px;border-radius:999px;
      font-size:13px;transition:.15s;}
    .chip:hover{border-color:var(--primary);color:var(--primary-700);background:var(--primary-50);}

    /* 数据面板（真实业务数据展示） */
    .data-panel{margin:6px 0 4px;}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      padding:16px 18px;box-shadow:var(--shadow);}
    .panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
    .panel-h>span:first-child{font-weight:700;font-size:15px;}
    .panel-sub{font-size:12px;color:var(--muted);}
    .panel-loading,.empty{color:var(--muted);font-size:13px;padding:8px 2px;}

    .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
    .slot-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.15s;background:#fff;}
    .slot-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(13,148,136,.12);}
    .slot-card.disabled{opacity:.6;cursor:not-allowed;}
    .slot-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
    .slot-top b{font-size:15px;}
    .period{font-size:12px;color:var(--primary-700);background:var(--primary-50);padding:2px 9px;border-radius:999px;}
    .slot-doc{font-size:12px;color:var(--muted);margin-bottom:10px;}
    .slot-foot{display:flex;justify-content:space-between;align-items:center;}
    .remain{font-size:13px;font-weight:600;color:#0f766e;}
    .remain.full{color:var(--muted);}
    .tag-full{font-size:12px;color:var(--muted);}
    .book-btn{font-size:13px;color:var(--primary-700);font-weight:600;}

    .report-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
    .report-card{border:1px solid var(--line);border-left:3px solid #cbd5e1;border-radius:12px;padding:12px 14px;background:#fff;}
    .report-card.abnormal{border-left-color:var(--danger);background:var(--danger-50);}
    .rc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .rc-top b{font-size:14px;}
    .badge-abn{font-size:11px;color:#fff;background:var(--danger);padding:1px 8px;border-radius:999px;}
    .badge-ok{font-size:11px;color:#0f766e;background:var(--primary-50);padding:1px 8px;border-radius:999px;}
    .rc-val{font-size:16px;font-weight:700;}
    .rc-meta{font-size:12px;color:var(--muted);margin:3px 0 8px;}
    .link-btn{border:none;background:none;color:var(--primary-700);font-size:13px;padding:0;cursor:pointer;font-weight:600;}

    .vital-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
    .vital-card{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fff;}
    .v-name{font-size:12px;color:var(--muted);}
    .v-val{font-size:20px;font-weight:700;margin:4px 0;color:var(--primary-700);}
    .v-unit{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px;}
    .v-time{font-size:11px;color:var(--muted);}
    .rem-h{font-weight:700;font-size:14px;margin:6px 0 8px;}
    .rem-list{display:flex;flex-direction:column;gap:8px;}
    .rem-item{display:flex;gap:10px;align-items:flex-start;}
    .rem-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:none;}
    .rem-body{font-size:13px;}
    .rem-meta{font-size:11px;color:var(--muted);}

    .dept-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
    .dept-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;}
    .dept-card b{font-size:14px;}
    .dept-card span{display:block;font-size:12px;color:var(--muted);margin:4px 0 8px;}

    /* 体检详细流程报表 */
    .flow-summary{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
    .flow-stat{background:var(--primary-50);border:1px solid #cdeae5;border-radius:12px;padding:10px 18px;font-size:12px;color:var(--primary-700);text-align:center;}
    .flow-stat b{font-size:22px;display:block;color:#0f766e;line-height:1.2;}
    .flow-path{background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;margin-bottom:18px;font-size:13px;color:#475569;line-height:1.7;}
    .flow-path b{color:var(--ink);}
    .flow-list{position:relative;}
    .flow-step{display:flex;gap:14px;padding:0 0 18px 0;position:relative;}
    .flow-step:last-child{padding-bottom:4px;}
    .flow-rail{display:flex;flex-direction:column;align-items:center;flex:none;}
    .flow-dot{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;z-index:1;}
    .flow-step.done .flow-dot{background:var(--muted);}
    .flow-line{width:2px;flex:1;background:var(--line);margin-top:4px;}
    .flow-step:last-child .flow-line{display:none;}
    .flow-body{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);}
    .flow-step.done .flow-body{opacity:.72;}
    .flow-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .flow-name{font-size:15px;font-weight:700;}
    .flow-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:auto;}
    .flow-badge.todo{background:var(--amber-50);color:var(--amber);border:1px solid #fde68a;}
    .flow-badge.done{background:var(--primary-50);color:var(--primary-700);border:1px solid #cdeae5;}
    .flow-loc{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#0f766e;background:var(--primary-50);padding:4px 11px;border-radius:8px;margin-bottom:6px;}
    .flow-note{font-size:12.5px;color:var(--muted);}
    .flow-meta{font-size:11px;color:var(--muted);margin-top:5px;}

    .chat{flex:1;overflow-y:auto;padding:14px 4px 8px;display:flex;flex-direction:column;gap:14px;}
    .msg{display:flex;gap:10px;max-width:78%;}
    .msg .ava{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;
      justify-content:center;font-size:12px;font-weight:700;color:#fff;}
    .msg.user{align-self:flex-end;flex-direction:row-reverse;}
    .msg.user .ava{background:var(--primary);}
    .msg.bot .ava{background:#94a3b8;}
    .bubble{padding:11px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word;}
    .msg.user .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
    .msg.bot .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;}
    .bubble .who{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;}
    .typing{display:inline-flex;gap:4px;padding:4px 2px;}
    .typing i{width:6px;height:6px;border-radius:50%;background:#94a3b8;animation:blink 1.2s infinite;}
    .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

    .banner{display:flex;gap:12px;align-items:flex-start;background:var(--amber-50);
      border:1px solid #fde68a;border-radius:12px;padding:13px 15px;font-size:13px;}
    .banner .bi{color:var(--amber);flex:none;margin-top:1px;}
    .banner b{color:#92400e;}
    .banner .aid{font-family:ui-monospace,Menlo,monospace;background:#fff;border:1px solid #fde68a;
      padding:1px 7px;border-radius:6px;color:#92400e;}

    /* 预约成功卡（自动执行，无需审批） */
    .ok-card{display:flex;gap:12px;align-items:flex-start;background:var(--primary-50);
      border:1px solid #cdeae5;border-radius:12px;padding:13px 15px;font-size:13px;}
    .ok-card .oci{color:#0d9488;flex:none;margin-top:1px;}
    .ok-card b{color:#0f766e;}
    .ok-card .ok-detail{font-size:12px;color:var(--muted);margin-top:4px;}

    /* 会话切换提示 */
    .switch-tip{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 4px;
      letter-spacing:.02em;}

    .composer{border-top:1px solid var(--line);background:var(--surface);padding:14px 4px 18px;
      display:flex;gap:10px;align-items:flex-end;}
    .composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;
      padding:11px 14px;font-size:14px;font-family:inherit;line-height:1.5;max-height:120px;outline:none;}
    .composer textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50);}
    .send{background:var(--primary);color:#fff;border:none;padding:11px 22px;border-radius:12px;
      font-size:14px;font-weight:600;flex:none;}
    .send:hover{background:var(--primary-700);}
    .send:disabled{opacity:.55;cursor:not-allowed;}
    .hint{font-size:11px;color:var(--muted);text-align:center;padding:0 4px 12px;}

    /* 登录遮罩 */
    .mask{position:fixed;inset:0;background:#eef2f6;display:flex;align-items:center;justify-content:center;z-index:50;}
    .login-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
      width:360px;max-width:90vw;padding:28px 26px;}
    .login-card h3{margin:0 0 4px;font-size:18px;}
    .login-card p{margin:0 0 18px;color:var(--muted);font-size:13px;}
    .field{margin-bottom:13px;}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
    .field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;
      font-family:inherit;outline:none;}
    .field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50);}
    .login-card .send{width:100%;}
    .alt{margin-top:12px;font-size:12px;color:var(--muted);text-align:center;}
    .alt a{color:var(--primary-700);cursor:pointer;}
    .err{color:var(--danger);font-size:12px;min-height:16px;margin-top:6px;}

    @media(max-width:760px){
      .sidenav{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px;}
      .nav-title,.side-foot{display:none;}
      .nav-item{margin:0 4px 0 0;white-space:nowrap;}
      .layout{flex-direction:column;}
      .content{padding:14px;}
      .msg{max-width:90%;}
    }

    /* 知情同意强制弹窗（Tier-0 法律责任红线） */
    .consent-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:80;}
    .consent-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.25);width:460px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column;}
    .consent-card h3{margin:0;padding:20px 24px 6px;font-size:17px;}
    .consent-card .sub{padding:0 24px 10px;color:var(--muted);font-size:13px;}
    .consent-body{overflow-y:auto;padding:4px 24px 12px;font-size:13px;line-height:1.75;color:#334155;white-space:pre-wrap;}
    .consent-foot{padding:14px 24px 20px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;}
    .consent-foot .chk{display:flex;align-items:center;gap:8px;font-size:13px;flex:1;cursor:pointer;}
    .consent-foot .send{background:var(--primary);color:#fff;border:none;padding:11px 22px;border-radius:12px;font-size:14px;font-weight:600;flex:none;}
    .consent-foot .send:disabled{opacity:.5;cursor:not-allowed;}

    /* 紧急救助 / 范围说明 气泡（硬闸渲染） */
    .msg.bot.emergency .bubble{background:var(--danger-50);border:1px solid #fecaca;}
    .msg.bot.emergency .bubble .who{color:var(--danger);}
    .msg.bot.scope .bubble{background:var(--amber-50);border:1px solid #fde68a;}
    .msg.bot.scope .bubble .who{color:#92400e;}
    .disclaimer-note{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.5;}
  </style>
</head>
<body>

  <!-- 登录遮罩 -->
  <div class="mask" id="loginMask">
    <div class="login-card">
      <h3>康宁健康 · 患者服务台</h3>
      <p>登录后即可使用智能分诊、预约挂号、报告解读等服务</p>

      <!-- 登录表单 -->
      <div id="loginForm">
        <div class="field">
          <label>手机号 / 用户名</label>
          <input id="lu" value="alice" autocomplete="username" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="lp" type="password" value="alice123" autocomplete="current-password" />
        </div>
        <button class="send" data-action="login">登录</button>
        <div class="err" id="lerr"></div>
        <div class="alt" data-action="show-register">还没有账号？<a>立即注册 ›</a></div>
      </div>

      <!-- 注册表单 -->
      <div id="regForm" style="display:none">
        <div class="field">
          <label>用户名（用于登录的唯一账号）</label>
          <input id="ru" placeholder="3-32 位字母/数字/下划线" autocomplete="username" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="rp" type="password" placeholder="至少 6 位" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>确认密码</label>
          <input id="rp2" type="password" placeholder="再次输入密码" autocomplete="new-password" />
        </div>
        <button class="send" data-action="register">注册并登录</button>
        <div class="err" id="rerr"></div>
        <div class="alt" data-action="show-login">已有账号？<a>去登录 ›</a></div>
      </div>

      <div class="alt" style="margin-top:10px">医护人员请前往 <a data-action="go-review">医护工作台 →</a></div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 5.65-7 10-7 10Z"/><path d="M5 12h3l2-3 2 5 2-3h3"/></svg>
      </div>
      <div>康宁健康<small>智慧医疗服务台</small></div>
    </div>
    <div class="userbox" id="userbox" style="display:none">
      <div class="who"><b id="uname">—</b><span>患者</span></div>
      <div class="avatar" id="uava">—</div>
      <div class="acct-wrap">
        <button class="btn-ghost" data-action="toggle-acct-menu">切换 ▾</button>
        <div class="acct-menu" id="acctMenu" style="display:none"></div>
      </div>
      <button class="btn-ghost" data-action="logout">退出</button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧服务导航：对应链路图 5 大子 Agent -->
    <aside class="sidenav">
      <div class="nav-title">就医服务</div>
      <a class="nav-item active" data-svc="home">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
        健康咨询
      </a>
      <a class="nav-item" data-svc="triage">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></svg>
        智能分诊
      </a>
      <a class="nav-item" data-svc="booking">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        预约挂号
      </a>
      <a class="nav-item" data-svc="hospital">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M12 21v-7M9 11h.01M15 11h.01M9 14h.01M15 14h.01"/></svg>
        院内服务
      </a>
      <a class="nav-item" data-svc="intake">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v2h2a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2V3a1 1 0 0 1 1-1Z"/><path d="M9 13h6M9 17h4"/></svg>
        报告解读
      </a>
      <a class="nav-item" data-svc="followup">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>
        健康随访
      </a>
      <a class="nav-item" data-svc="examflow">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6a1 1 0 0 1 1 1v2h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2V4a1 1 0 0 1 1-1Z"/><path d="M9 12h6M9 16h4"/></svg>
        体检流程
      </a>
      <a class="nav-item danger" data-svc="emergency">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
        急症求助
      </a>
      <div class="side-foot">
        数据加密传输 · 隐私保护<br/>
        急危重症请直接拨打 <b>120</b>
      </div>
    </aside>

    <!-- 主区 -->
    <main class="content">
      <div class="svc-head">
        <h2 id="svcTitle">健康咨询</h2>
        <p id="svcDesc">描述您的症状或需求，我们将为您安排对应的就医服务。</p>
      </div>
      <div class="chips" id="chips"></div>
      <div class="data-panel" id="dataPanel"></div>
      <div class="switch-tip" id="switchTip"></div>
      <div class="chat" id="chat"></div>
      <div id="bannerHost"></div>
      <div class="composer">
        <textarea id="msg" rows="1" placeholder="请输入您要咨询的内容…" data-keydown-enter="send"></textarea>
        <button class="send" id="sendBtn" data-action="send">发送</button>
      </div>
      <div class="hint">本服务为 AI 辅助的健康科普与分诊引导，不提供诊断或处方；最终诊疗以面诊医生意见为准。急危重症请立即拨打 120。</div>
    </main>
  </div>

<script>
const API_BASE = window.location.origin;
function absUrl(u){ if(!u) return u; if(u.startsWith("http://")||u.startsWith("https://")) return u; return API_BASE + u; }

  const SERVICES = {
    home:    {title:"健康咨询", desc:"描述您的症状或需求，我们将为您安排对应的就医服务。",
      chips:["我最近总是头疼，有点担心","我想预约下周的门诊","帮我看看我的化验单"]},
    triage:  {title:"智能分诊", desc:"说明您的不适，系统为您推荐合适的就诊科室；也可直接从下方科室导航选择。",
      chips:["我头痛伴恶心，挂什么科？","老人胸闷气短挂哪个科？","小孩反复发烧怎么办？"]},
    booking: {title:"预约挂号", desc:"选择下方号源即可自动预约（有名额即锁定）；如需医保结算将由医生确认。",
      chips:["挂神经内科今天上午的号","预约心内科明天下午并办医保结算","帮我锁定呼吸内科的号"]},
    hospital:{title:"院内服务", desc:"就诊流程、门诊时间、医保报销、检查化验须知、院区交通停车、体检与互联网医院复诊等院内事务，点击快速咨询。",
      chips:["门诊几点开门？","医保怎么报销？","抽血要空腹吗？","去医院怎么停车？","体检前要注意什么？","互联网医院怎么用？"]},
    intake:  {title:"报告解读", desc:"系统已拉取您的检验报告（来自检验系统），可点开查看并申请解读。",
      chips:["帮我解读最近的化验报告","我的血常规报告正常吗？","解读一下肝功能化验单"]},
    followup:{title:"健康随访", desc:"系统已加载您的体征与随访提醒，可继续与助手沟通记录随访计划。",
      chips:["记录我的血压随访，今天 145/95","提醒我下周复查血糖","查看我的慢病随访计划"]},
    examflow:{title:"体检详细流程单", desc:"主诊医生为您开具的检查项目与对应位置，请按流程顺序逐项完成。"},
    emergency:{title:"急症求助", desc:"出现急危重症时，系统将立即转接急诊并联系医护人员。",
      chips:["我胸口剧痛喘不上气","突然半边身体麻木说不出话","家里老人晕倒了"]},
  };
  const TOOL_NAME = {lock_appointment:"锁定号源", medicare_settle:"医保结算", handoff:"转诊交接", call_120:"呼叫 120"};
  const VITAL_NAME = {BP:"血压", HR:"心率", TEMP:"体温", SpO2:"血氧"};

  let TOKEN = "", USER = "", REFRESH = localStorage.getItem("med_refresh")||"", curSvc = "home", streaming = false;
  let lastSlots = [];

  /* ====== 多会话隔离：每个服务模块独立的 thread_id + 消息列表 ====== */
  let sessionMsgs = {};   // { svc: [ {role, who, text}, ... ] }
  let sessionBanner = {}; // { svc: payload | null }  审核状态卡也按模块存
  let sessionOkCard = {}; // { svc: text | null }       成功卡也按模块存

  function getTid(svc){ return "thr-"+USER+"-"+svc; }

  function $(id){return document.getElementById(id);}
  function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

  function setSvc(svc){
    if(svc === curSvc) return;  // 同模块不重复切换

    // 1) 保存当前模块的消息和状态卡
    saveSession(curSvc);

    // 2) 切换到新模块
    curSvc = svc;
    document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.svc===svc));
    $("svcTitle").textContent = SERVICES[svc].title;
    $("svcDesc").textContent = SERVICES[svc].desc;

    // 体检流程为「报表视图」：隐藏聊天输入框，专注展示流程单
    const isFlow = (svc === "examflow");
    setChatVisible(!isFlow);

    // 3) 更新快捷短语
    const c = $("chips"); c.innerHTML = "";
    if(!isFlow && SERVICES[svc].chips){
      SERVICES[svc].chips.forEach(t=>{
        const b = document.createElement("button"); b.className="chip"; b.textContent=t;
        b.onclick = ()=>{ $("msg").value=t; send(); };
        c.appendChild(b);
      });
    }

    // 4) 清空聊天区 + 加载目标模块历史消息
    restoreSession(svc);

    // 5) 加载数据面板（全局档案跨模块共享）
    loadServiceData(svc);

    // 6) 从服务端拉取本线程历史对话，刷新后重渲染
    hydrate(svc);
  }

  function setChatVisible(v){
    $("chat").style.display = v ? "flex" : "none";
    document.querySelector(".composer").style.display = v ? "flex" : "none";
    $("hint") && ($("hint").style.display = v ? "block" : "none");
    $("switchTip").style.display = v ? "block" : "none";
  }

  /** 保存当前聊天区的 DOM 消息到 sessionMsgs[curSvc] */
  function saveSession(svc){
    const msgs = [];
    $("chat").querySelectorAll(".msg").forEach(m=>{
      const role = m.classList.contains("user") ? "user" : "bot";
      const whoEl = m.querySelector(".who");
      const who = whoEl ? whoEl.textContent : "";
      const txtEl = m.querySelector(".txt");
      const txt = txtEl ? txtEl.textContent : "";
      if(txt) msgs.push({role, who, text: txt});
    });
    sessionMsgs[svc] = msgs;
    // 状态卡不存 DOM（每次从后端重新获取），只记标志
  }

  /** 从 sessionMsgs 恢复目标模块的消息到聊天区 */
  function restoreSession(svc){
    const chat = $("chat"); chat.innerHTML = "";
    $("bannerHost").innerHTML = "";
    $("switchTip").textContent = "";

    const msgs = sessionMsgs[svc] || [];
    if(msgs.length === 0){
      // 新会话：显示欢迎提示 + 欢迎语（唯一出口，避免重复）
      $("switchTip").textContent = "── 已开启新的 "+SERVICES[svc].title+" 会话 ──";
      addMsg("bot", SERVICES[svc].title, SERVICES[svc].desc);
    }
    msgs.forEach(m => {
      addMsgToDOM(m.role, m.who, m.text);
    });

    // 恢复该模块的状态卡（如果有缓存）
    if(sessionBanner[svc]) showBannerDOM(sessionBanner[svc]);
    if(sessionOkCard[svc]) showOkCardDOM(sessionOkCard[svc]);
  }

  document.querySelectorAll(".nav-item").forEach(n=> n.onclick = ()=>setSvc(n.dataset.svc));

  // 刷新/重进后从服务端拉取本线程历史对话，重渲染聊天框（避免内存清空即丢消息）
  let hydrated = {};  // { svc: true } 标记本模块是否已从服务端拉取过历史，避免重复拉取
  async function hydrate(svc){
    if(!TOKEN) return;
    if(hydrated[svc]) return;  // 已拉过（含欢迎语场景），不重复
    hydrated[svc] = true;
    try{
      const r = await apiFetch("/api/chat-history?thread_id="+encodeURIComponent(getTid(svc)));
      if(!r.ok) return;
      const d = await r.json();
      const msgs = d.messages || [];
      if(!msgs.length) return;  // 服务端无历史，保留欢迎语
      // 用服务端历史覆盖（清空聊天区，含欢迎语占位）
      sessionMsgs[svc] = msgs.map(m=>({role:m.role, who: m.role==="bot"?SERVICES[svc].title:"", text:m.text}));
      const chat=$("chat"); chat.innerHTML="";
      msgs.forEach(m=> addMsgToDOM(m.role, m.role==="bot"?SERVICES[svc].title:"", m.text));
      chat.scrollTop = chat.scrollHeight;
    }catch(e){ /* 拉取失败不影响新对话 */ }
  }

  // -------- 真实业务数据加载（按服务模块，跨模块共享展示） --------
  async function loadServiceData(svc){
    const host = $("dataPanel"); host.innerHTML = "";
    if(!TOKEN) return;
    if(svc==="booking")   return renderBooking(host);
    if(svc==="intake")    return renderReports(host);
    if(svc==="followup")  return renderFollowup(host);
    if(svc==="triage")    return renderDepartments(host);
    if(svc==="examflow")  return renderExamFlow(host);
  }

  // 体检详细流程单（医生开具的检查项目 + 对应楼宇位置）
  async function renderExamFlow(host){
    host.innerHTML = '<div class="panel-loading">正在加载您的体检详细流程…</div>';
    try{
      const d = await apiFetch("/api/patient/exam-flow").then(x=>x.json());
      const steps = d.steps || [];
      let html = '<div class="panel"><div class="panel-h"><span>体检详细流程单</span>'+
        '<span class="panel-sub">'+ esc(d.patient) +' · 由主诊医生开具</span></div>';
      if(!steps.length){
        html += '<div class="empty">暂无检查流程。医生面诊后会为您开具验血、彩超、CT 等检查项目，并标注每项的楼宇位置。</div></div>';
        host.innerHTML = html; return;
      }
      // 概览统计
      html += '<div class="flow-summary">'+
        '<div class="flow-stat">共 <b>'+d.total+'</b> 项</div>'+
        '<div class="flow-stat">已完成 <b>'+d.done+'</b> 项</div>'+
        '<div class="flow-stat">待完成 <b>'+(d.total-d.done)+'</b> 项</div></div>';
      // 路径指引：按位置聚合，提示先去哪栋楼
      const locOrder = []; const locMap = {};
      steps.forEach(s=>{ if(!locMap[s.location]){ locMap[s.location]=true; locOrder.push(s.location); } });
      html += '<div class="flow-path">🧭 <b>就诊路径指引：</b>请按流程顺序完成，涉及楼宇：'+
        locOrder.map(l=>'「'+l+'」').join(' → ')+'，建议携带医保卡与过往报告。</div>';
      // 流程时间线
      html += '<div class="flow-list">';
      steps.forEach((s,i)=>{
        const done = s.status==="DONE";
        html += '<div class="flow-step'+(done?' done':'')+'">'+
          '<div class="flow-rail"><div class="flow-dot">'+(done?'✓':(i+1))+'</div><div class="flow-line"></div></div>'+
          '<div class="flow-body">'+
            '<div class="flow-top"><span class="flow-name">'+esc(s.name)+'</span>'+
              '<span class="flow-badge '+(done?'done':'todo')+'">'+(done?'已完成':'待完成')+'</span></div>'+
            '<div class="flow-loc">📍 '+esc(s.location)+'</div>'+
            (s.note?'<div class="flow-note">备注：'+esc(s.note)+'</div>':'')+
            (s.done_at?'<div class="flow-meta">完成时间：'+esc(s.done_at.replace('T',' ').slice(0,16))+'</div>':'')+
          '</div></div>';
      });
      html += '</div></div>';
      host.innerHTML = html;
    }catch(e){ host.innerHTML = '<div class="panel-loading">流程加载失败，请稍后重试。</div>'; }
  }

  async function renderBooking(host){
    host.innerHTML = '<div class="panel-loading">正在加载可约号源…</div>';
    try{
      const r = await apiFetch("/api/appointments/available");
      const d = await r.json();
      lastSlots = d.slots || [];
      let html = '<div class="panel"><div class="panel-h"><span>今日可约号源</span>'+
        '<span class="panel-sub">'+ esc(d.date) +' · 有名额即可自动预约</span></div>';
      if(!lastSlots.length){
        html += '<div class="empty">今日号源已约满，请明日再来或现场挂号。</div></div>';
      }else{
        html += '<div class="slot-grid">';
        lastSlots.forEach((s,i)=>{
          const full = s.remaining<=0;
          html += '<div class="slot-card'+(full?' disabled':'')+'" '+ (full?'':('data-i="'+i+'"')) +'>'+
            '<div class="slot-top"><b>'+esc(s.department)+'</b><span class="period">'+(s.period==="AM"?"上午":"下午")+'</span></div>'+
            '<div class="slot-doc">'+esc(s.doctor)+' · '+esc(s.title)+'</div>'+
            '<div class="slot-foot"><span class="remain '+(full?'full':'')+'">剩余 '+s.remaining+' 号</span>'+
            (full?'<span class="tag-full">已满</span>':'<span class="book-btn">预约 ›</span>')+'</div></div>';
        });
        html += '</div></div>';
      }
      host.innerHTML = html;
      host.querySelectorAll('.slot-card[data-i]').forEach(c=>{
        c.onclick = ()=>{
          const s = lastSlots[+c.dataset.i]; if(!s) return;
          const dept = s.department, d = s.date, period = s.period==="AM"?"上午":"下午";
          $("msg").value = "我要预约 "+dept+" "+d+" "+period+" 的号，请锁定号源";
          send();
        };
      });
    }catch(e){ host.innerHTML = '<div class="panel-loading">号源加载失败，请稍后重试。</div>'; }
  }

  async function renderReports(host){
    host.innerHTML = '<div class="panel-loading">正在加载您的检验报告…</div>';
    try{
      const list = await apiFetch("/api/reports").then(x=>x.json());
      let html = '<div class="panel"><div class="panel-h"><span>我的检验报告</span>'+
        '<span class="panel-sub">数据来自检验系统（LIS）</span></div>';
      if(!list.length){ html += '<div class="empty">暂无检验报告记录。</div></div>'; }
      else{
        html += '<div class="report-list">';
        list.forEach(x=>{
          const item = x.item || "";
          const result = x.result || "";
          const ref = x.ref_range || "—";
          const date = x.report_date || "";
          const abnormal = x.abnormal ? "1" : "0";
          html += '<div class="report-card'+(x.abnormal?' abnormal':'')+'">'+
            '<div class="rc-top"><b>'+esc(item)+'</b>'+(x.abnormal?'<span class="badge-abn">异常</span>':'<span class="badge-ok">正常</span>')+'</div>'+
            '<div class="rc-val">'+esc(result)+'</div>'+
            '<div class="rc-meta">参考 '+esc(ref)+' · '+esc(date)+'</div>'+
            '<button class="link-btn" data-ask="report" data-item="'+esc(item)+'" data-result="'+esc(result)+'" data-ref="'+esc(ref)+'" data-date="'+esc(date)+'" data-abnormal="'+abnormal+'">请解读这份报告 ›</button></div>';
        });
        html += '</div></div>';
      }
      host.innerHTML = html;
      host.querySelectorAll('button[data-ask="report"]').forEach(b=>{
        b.onclick = ()=> askReport(b.dataset.item, b.dataset.result, b.dataset.ref, b.dataset.date, b.dataset.abnormal==="1");
      });
    }catch(e){ host.innerHTML = '<div class="panel-loading">报告加载失败。</div>'; }
  }
  function askReport(item, result, refRange, date, abnormal){
    if(!item){ return; }
    // 自动切换到「报告解读」模块，确保解读对话落在 intake 上下文
    setSvc("intake");
    const status = abnormal ? "异常（超出参考范围）" : "正常";
    const prompt = "请帮我解读我的【"+item+"】检验报告："
      +"结果 "+result+"，"
      +"参考范围 "+refRange+"，"
      +"报告日期 "+date+"，"
      +"状态 "+status+"。"
      +"请说明这个指标的临床意义、本次结果的含义、日常注意事项，以及是否需要复诊或进一步评估；如需就诊请推荐科室。";
    $("msg").value = prompt;
    send();
  }

  async function renderFollowup(host){
    host.innerHTML = '<div class="panel-loading">正在加载健康档案…</div>';
    try{
      const [v, r] = await Promise.all([
        apiFetch("/api/vitals").then(x=>x.json()),
        apiFetch("/api/reminders").then(x=>x.json()),
      ]);
      let html = '<div class="panel"><div class="panel-h"><span>我的健康档案</span>'+
        '<span class="panel-sub">最近体征与随访提醒</span></div>';
      html += '<div class="vital-grid">';
      if(!v.length) html += '<div class="empty">暂无体征记录。</div>';
      v.forEach(x=>{
        html += '<div class="vital-card"><div class="v-name">'+(VITAL_NAME[x.type]||x.type)+'</div>'+
          '<div class="v-val">'+esc(x.value)+'<span class="v-unit">'+esc(x.unit||'')+'</span></div>'+
          '<div class="v-time">'+esc(x.measured_at||'')+'</div></div>';
      });
      html += '</div>';
      html += '<div class="rem-h">随访提醒</div>';
      if(!r.length) html += '<div class="empty">暂无随访提醒。</div>';
      else{
        html += '<div class="rem-list">';
        r.forEach(x=>{
          html += '<div class="rem-item"><div class="rem-dot"></div><div class="rem-body"><div>'+esc(x.content)+'</div>'+
            '<div class="rem-meta">'+esc(x.remind_at||'—')+' · '+(x.status==="DONE"?"已完成":"待执行")+'</div></div></div>';
        });
        html += '</div>';
      }
      html += '</div>';
      host.innerHTML = html;
    }catch(e){ host.innerHTML = '<div class="panel-loading">健康档案加载失败。</div>'; }
  }

  async function renderDepartments(host){
    try{
      const list = await apiFetch("/api/departments").then(x=>x.json());
      let html = '<div class="panel"><div class="panel-h"><span>科室导航</span>'+
        '<span class="panel-sub">按症状选择对应科室</span></div><div class="dept-list">';
      list.forEach(d=>{
        const name = d.name || "";
        html += '<div class="dept-card"><b>'+esc(name)+'</b><span>'+esc(d.description||'')+'</span>'+
          '<button class="link-btn" data-ask="dept" data-item="'+esc(name)+'">智能分诊 ›</button></div>';
      });
      html += '</div></div>';
      host.innerHTML = html;
      host.querySelectorAll('button[data-ask="dept"]').forEach(b=> b.onclick=()=> askDept(b.dataset.item));
    }catch(e){ host.innerHTML = ''; }
  }
  function askDept(name){ $("msg").value = "我应该挂"+name+"吗？请帮我分诊"; send(); }

  // -------- 多账号本地记忆 --------
  function rememberAccount(u, token, refresh){
    let acc = {}; try{ acc = JSON.parse(localStorage.getItem("med_accounts")||"{}"); }catch(e){}
    acc[u] = {token: token, refresh: refresh||""}; localStorage.setItem("med_accounts", JSON.stringify(acc));
  }
  function getAccounts(){ try{ return JSON.parse(localStorage.getItem("med_accounts")||"{}"); }catch(e){ return {}; } }

  // 统一带鉴权的请求封装：访问令牌过期(401)时自动用刷新令牌续期一次，失败则强制重新登录。
  async function apiFetch(url, opts={}){
    opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
    if(TOKEN) opts.headers["Authorization"] = TOKEN;
    let r = await fetch(absUrl(url), opts);
    if(r.status===401 && REFRESH){
      try{
        const rf = await fetch(absUrl("/auth/refresh"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refresh_token:REFRESH})});
        if(rf.ok){
          const d = await rf.json();
          TOKEN = "Bearer "+d.access_token; REFRESH = d.refresh_token||"";
          localStorage.setItem("med_refresh", REFRESH); rememberAccount(USER, TOKEN, REFRESH);
          opts.headers["Authorization"] = TOKEN;
          r = await fetch(absUrl(url), opts);
        } else { REFRESH=""; localStorage.removeItem("med_refresh"); }
      }catch(e){ REFRESH=""; localStorage.removeItem("med_refresh"); }
    }
    if(r.status===401){
      TOKEN=""; REFRESH=""; localStorage.removeItem("med_refresh"); localStorage.removeItem("med_token");
      $("loginMask").style.display="flex";
      throw new Error("unauthorized");
    }
    return r;
  }

  function renderAccountSwitcher(){
    // 切换按钮上标注已记住的账号数量
    const n = Object.keys(getAccounts()).length;
    const btn = document.querySelector(".acct-wrap .btn-ghost");
    if(btn) btn.textContent = (n>1 ? "切换("+n+") " : "切换 ") + "▾";
  }

  // -------- 登录 / 注册 / 切换 --------
  function enterApp(u, token, refresh){
    TOKEN=token; USER=u;
    REFRESH = refresh || "";
    rememberAccount(u, token, REFRESH);
    if(REFRESH) localStorage.setItem("med_refresh", REFRESH); else localStorage.removeItem("med_refresh");
    $("loginMask").style.display="none";
    $("userbox").style.display="flex";
    $("uname").textContent=u; $("uava").textContent=u.slice(0,1).toUpperCase();
    renderAccountSwitcher();
    // 初始化当前模块为全新会话
    sessionMsgs = {};
    sessionBanner = {};
    sessionOkCard = {};
    restoreSession(curSvc);  // 新会话自动展示欢迎语（唯一出口）
    loadServiceData(curSvc);
    hydrate(curSvc);  // 刷新后从服务端恢复历史对话
    checkConsent();          // Tier-0：按需弹出知情同意书
  }

  async function login(){
    const u=$("lu").value.trim(), p=$("lp").value;
    $("lerr").textContent="";
    try{
      const r = await fetch(absUrl("/auth/login"),{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u,password:p,role:"patient"})});
      const d = await r.json();
      if(!r.ok){ $("lerr").textContent = d.detail||"登录失败"; return; }
      enterApp(u, "Bearer "+d.access_token, d.refresh_token);
    }catch(e){ $("lerr").textContent="网络异常，请稍后再试"; }
  }

  function showRegister(){ $("loginForm").style.display="none"; $("regForm").style.display="block"; $("lerr").textContent=""; $("rerr").textContent=""; }
  function showLogin(){ $("regForm").style.display="none"; $("loginForm").style.display="block"; $("rerr").textContent=""; }

  async function register(){
    const u=$("ru").value.trim(), p=$("rp").value, p2=$("rp2").value;
    $("rerr").textContent="";
    if(!/^[A-Za-z0-9_]{3,32}$/.test(u)){ $("rerr").textContent="用户名需 3-32 位字母/数字/下划线"; return; }
    if(p.length<6){ $("rerr").textContent="密码至少 6 位"; return; }
    if(p!==p2){ $("rerr").textContent="两次密码不一致"; return; }
    try{
      const r = await fetch(absUrl("/auth/register"),{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u,password:p,role:"patient"})});
      const d = await r.json();
      if(!r.ok){ $("rerr").textContent = d.detail||"注册失败"; return; }
      // 注册成功自动登录
      const r2 = await fetch(absUrl("/auth/login"),{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u,password:p,role:"patient"})});
      const d2 = await r2.json();
      if(!r2.ok){ $("rerr").textContent="注册成功，请返回登录页手动登录"; return; }
      enterApp(u, "Bearer "+d2.access_token, d2.refresh_token);
    }catch(e){ $("rerr").textContent="网络异常，请稍后重试"; }
  }

  function openLogin(){
    $("loginMask").style.display="flex";
    $("lerr").textContent=""; $("rerr").textContent="";
    // 自动填入已记住的第一个账号，方便切换
    const acc = getAccounts(); const names = Object.keys(acc);
    if(names.length && !USER){ $("lu").value = names[0]; }
  }

  function toggleAcctMenu(e){
    e.stopPropagation();
    const m=$("acctMenu");
    if(m.style.display==="block"){ m.style.display="none"; return; }
    const acc=getAccounts(); m.innerHTML="";
    Object.keys(acc).forEach(u=>{
      const it=document.createElement("div");
      it.className="acct-item"+(u===USER?" active":"");
      it.textContent=u+(u===USER?"（当前）":"");
      it.onclick=()=>switchAccount(u);
      m.appendChild(it);
    });
    const add=document.createElement("div");
    add.className="acct-item add"; add.textContent="＋ 登录其他账号";
    add.onclick=()=>{ m.style.display="none"; openLogin(); };
    m.appendChild(add);
    m.style.display="block";
  }
  document.addEventListener("click", ()=>{ const m=$("acctMenu"); if(m) m.style.display="none"; });

  function switchAccount(u){
    const acc=getAccounts();
    if(!acc[u]){ openLogin(); return; }
    $("acctMenu").style.display="none";
    enterApp(u, acc[u].token, acc[u].refresh);
  }

  function logout(){
    const acc=getAccounts();
    delete acc[USER];
    localStorage.setItem("med_accounts", JSON.stringify(acc));
    TOKEN=""; USER=""; REFRESH=""; localStorage.removeItem("med_refresh");
    if(Object.keys(acc).length){ openLogin(); }
    else { location.reload(); }
  }

  // -------- 聊天 / SSE（操作当前模块的 thread_id 和消息列表） --------
  function addMsg(role, who, text){
    const el=addMsgToDOM(role, who, text);
    // 同时追加到当前模块的 session 记录
    if(!sessionMsgs[curSvc]) sessionMsgs[curSvc] = [];
    sessionMsgs[curSvc].push({role, who, text});
    return el;
  }

  function addMsgToDOM(role, who, text){
    const m=document.createElement("div"); m.className="msg "+role;
    const ava=document.createElement("div"); ava.className="ava"; ava.textContent = role==="user"?USER.slice(0,1).toUpperCase():"护";
    const b=document.createElement("div"); b.className="bubble";
    if(role==="bot"){ const w=document.createElement("div"); w.className="who"; w.textContent=who||"健康服务"; b.appendChild(w); }
    const t=document.createElement("div"); t.className="txt"; t.textContent=text; b.appendChild(t);
    m.appendChild(ava); m.appendChild(b); $("chat").appendChild(m);
    $("chat").scrollTop=$("chat").scrollHeight; return t;
  }

  function showTyping(){
    const m=document.createElement("div"); m.className="msg bot"; m.id="typingMsg";
    m.innerHTML='<div class="ava">护</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
    $("chat").appendChild(m); $("chat").scrollTop=$("chat").scrollHeight;
  }
  function clearTyping(){ const t=$("typingMsg"); if(t) t.remove(); }

  // 免责声明脚注：渲染于每条助手回复气泡下方（Tier-0「每次显著免责声明」）
  function appendDisclaimer(txtEl, text){
    const bubble = txtEl && txtEl.parentElement;
    if(!bubble) return;
    let d = bubble.querySelector(".disclaimer-note");
    if(!d){ d=document.createElement("div"); d.className="disclaimer-note"; bubble.appendChild(d); }
    d.textContent = text;
  }

  // 硬闸专用气泡：紧急救助（红）/ 服务范围说明（琥珀）
  function addSpecialMsg(kind, who, text){
    const m=document.createElement("div"); m.className="msg bot "+kind;
    const ava=document.createElement("div"); ava.className="ava"; ava.textContent="护";
    const b=document.createElement("div"); b.className="bubble";
    const w=document.createElement("div"); w.className="who"; w.textContent=who; b.appendChild(w);
    const t=document.createElement("div"); t.className="txt"; t.textContent=text; b.appendChild(t);
    m.appendChild(ava); m.appendChild(b); $("chat").appendChild(m); $("chat").scrollTop=$("chat").scrollHeight;
    if(!sessionMsgs[curSvc]) sessionMsgs[curSvc]=[];
    sessionMsgs[curSvc].push({role:"bot", who, text});
    return t;
  }
  function addEmergencyMsg(text){ return addSpecialMsg("emergency","🚨 紧急救助",text); }
  function addScopeMsg(text){ return addSpecialMsg("scope","服务范围说明",text); }

  function showBanner(payload){
    // 存到当前模块的 session 缓存
    sessionBanner[curSvc] = payload;
    showBannerDOM(payload);
  }
  function showBannerDOM(payload){
    const host=$("bannerHost"); host.innerHTML="";
    const tools=(payload.tools||[]).map(t=>TOOL_NAME[t]||t).join(" + ")||"相关操作";
    let kind = "";
    if(payload.action==="emergency_handoff") kind = "应急转诊";
    else if(payload.action==="medicare_settle") kind = "医保结算";
    else kind = "待审核操作";
    const b=document.createElement("div"); b.className="banner";
    b.innerHTML='<svg class="bi icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+
      '<div>已提交<b>'+kind+'</b>申请，待医生审核确认后执行（'+esc(tools)+'）。<br/>审核编号 <span class="aid">'+ esc(payload._aid||"") +'</span>，您可稍后在「健康咨询」中查看处理结果。</div>';
    host.appendChild(b);
  }

  function showOkCard(text){
    sessionOkCard[curSvc] = text;
    showOkCardDOM(text);
  }
  function showOkCardDOM(text){
    const host=$("bannerHost"); host.innerHTML="";
    const b=document.createElement("div"); b.className="ok-card";
    b.innerHTML='<svg class="oci icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+
      '<div><b>预约成功</b><div class="ok-detail">'+esc(text)+'</div></div>';
    host.appendChild(b);
  }

  async function send(){
    if(streaming) return;
    const inp=$("msg"); const text=inp.value.trim(); if(!text) return;
    if(!TOKEN){ $("loginMask").style.display="flex"; return; }
    if(needConsent){ showConsentModal(); return; }  // Tier-0：未同意则先拦截
    addMsg("user","",text); inp.value=""; inp.style.height="auto";
    streaming=true; $("sendBtn").disabled=true; showTyping();
    // 超时控制：90秒未完成自动中止，避免 deepseek 卡死时永久挂起
    const ac=new AbortController(); const timer=setTimeout(()=>ac.abort(),90000);
    try{
      // 使用当前模块的独立 thread_id
      const tid = getTid(curSvc);
      const resp=await apiFetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:text, thread_id:tid}), signal:ac.signal});
      clearTimeout(timer);
      // 状态码检查：非 200 时给出明确提示，避免 resp.body 为 null 导致 getReader() 崩溃
      if(!resp.ok){
        const errBody=await resp.text().catch(()=>"");
        clearTyping();
        if(resp.status===401){
          TOKEN=null; localStorage.removeItem("token"); $("loginMask").style.display="flex";
          addMsg("bot", SERVICES[curSvc].title, "登录已过期，请重新登录。");
        }else if(resp.status>=500){
          addMsg("bot", SERVICES[curSvc].title, "服务器繁忙，请稍后重试。("+resp.status+")");
        }else{
          addMsg("bot", SERVICES[curSvc].title, "请求失败("+resp.status+")，请稍后重试。");
        }
        return;
      }
      const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="", aid=null, done=null, payload=null, botEl=null, pendingDisclaimer="";
      clearTyping();
      const curTitle = SERVICES[curSvc].title;
      function ensureBotBubble(){
        if(!botEl){ botEl=addMsg("bot", curTitle, ""); if(pendingDisclaimer){ appendDisclaimer(botEl, pendingDisclaimer); pendingDisclaimer=""; } }
        return botEl;
      }
      while(true){
        const {done:nd,value}=await reader.read(); if(nd) break;
        buf+=dec.decode(value);
        const blocks=buf.split("\n\n"); buf=blocks.pop();
        for(const blk of blocks){
          if(!blk.startsWith("data:")) continue;
          let p; try{p=JSON.parse(blk.slice(5));}catch(e){continue;}
          if(p.type==="token"){ ensureBotBubble().textContent+=p.text; }
          else if(p.type==="emergency"){ botEl=addEmergencyMsg(p.text); if(pendingDisclaimer){appendDisclaimer(botEl,pendingDisclaimer);pendingDisclaimer="";} done="emergency"; }
          else if(p.type==="scope"){ botEl=addScopeMsg(p.text); if(pendingDisclaimer){appendDisclaimer(botEl,pendingDisclaimer);pendingDisclaimer="";} done="scope"; }
          else if(p.type==="consent_required"){ needConsent=true; showConsentModal(); done="consent"; }
          else if(p.type==="disclaimer"){ pendingDisclaimer=p.text; if(botEl){ appendDisclaimer(botEl, p.text); pendingDisclaimer=""; } }
          else if(p.type==="interrupt"){ aid=p.approval_id; payload=p.payload; done="human"; }
          else if(p.type==="done") done=p.turn;
          $("chat").scrollTop=$("chat").scrollHeight;
        }
      }
      if(aid && payload){ showBanner({...payload, _aid:aid}); }
      else if(!botEl && done && done!=="consent" && done!=="emergency" && done!=="scope"){ const b=addMsg("bot",curTitle,""); if(pendingDisclaimer) appendDisclaimer(b,pendingDisclaimer); b.textContent="已为您处理，请问还有其他需要吗？"; }
      // 挂号自动成功（无 interrupt）→ 显示绿色成功卡
      else if(curSvc==="booking" && !aid && botEl && (botEl.textContent.includes("挂号") || botEl.textContent.includes("预约") || botEl.textContent.includes("锁定"))){
        showOkCard(botEl.textContent);
      }
    }catch(e){
      clearTimeout(timer);
      clearTyping();
      // 显示具体错误信息用于诊断（正式环境可收起）
      const detail = e.name + ": " + (e.message || "").substring(0, 200);
      console.error("[chat] send error:", e);
      if(e.name==="AbortError"){
        addMsg("bot", SERVICES[curSvc].title, "⏱ 响应超时（90秒），AI模型可能较慢。请稍后重试。\n[调试] " + detail);
      }else if(e.message && (e.message.includes("fetch") || e.message.includes("Failed") || e.message.includes("NetworkError"))){
        addMsg("bot", SERVICES[curSvc].title, "🔌 网络连接失败，请检查网络/代理设置。\n[调试] " + detail);
      }else if(e.message && e.message.includes("Unexpected token")){
        addMsg("bot", SERVICES[curSvc].title, "⚠ 服务端返回异常数据。\n[调试] " + detail);
      }else{
        addMsg("bot", SERVICES[curSvc].title, "❌ 服务暂时不可用\n[调试] " + detail);
      }
    }finally{
      streaming=false; $("sendBtn").disabled=false; $("chat").scrollHeight && ($("chat").scrollTop=$("chat").scrollHeight);
    }
  }
  $("msg").addEventListener("input",function(){ this.style.height="auto"; this.style.height=Math.min(this.scrollHeight,120)+"px"; });

  setSvc("home");
</script>

  <!-- 知情同意强制弹窗（Tier-0：首次使用对话服务前必须先同意） -->
  <div class="consent-mask" id="consentMask" style="display:none">
    <div class="consent-card">
      <h3>知情同意书</h3>
      <div class="sub">使用康宁健康 AI 对话服务前，请先阅读并同意以下条款</div>
      <div class="consent-body" id="consentBody"></div>
      <div class="consent-foot">
        <label class="chk"><input type="checkbox" id="consentChk" /> 我已阅读并理解上述全部内容</label>
        <button class="send" id="consentBtn" disabled data-action="submit-consent">同意并继续</button>
      </div>
    </div>
  </div>

  <script>
  /* ====== 知情同意（Tier-0 法律责任红线） ====== */
  const CONSENT_TEXT = (
    "一、服务性质\n" +
    "本服务是由人工智能辅助的「健康科普 / 智能分诊 / 就医引导」工具，并非医疗机构，" +
    "不提供疾病诊断、不出具处方、不替代医师面诊。\n\n" +
    "二、责任边界\n" +
    "AI 的回复可能存在偏差或不确定性，关键医疗决策（用药、手术、急症处置等）必须由具备资质的" +
    "执业医师作出。您理解并同意：因依赖本服务而产生的任何健康风险由本人承担。\n\n" +
    "三、数据处理\n" +
    "为提供服务与质量改进，您与系统的对话内容将被记录（含输入/输出文本、时间、链路追踪标识）。" +
    "我们按最小必要原则处理个人信息，并依据《个人信息保护法》等法规予以保护。\n\n" +
    "四、急症免责\n" +
    "当您描述胸痛、呼吸困难、大出血、昏迷、卒中（面瘫/肢体无力/言语不清）等危急征象时，" +
    "系统会直接提示您拨打 120 或前往最近急诊，而不会给出常规对话式建议。\n\n" +
    "点击「我已阅读并同意」，即表示您已知晓上述条款并自愿使用本服务。"
  );
  let needConsent = false;

  function checkConsent(){
    if(!TOKEN) return;
    apiFetch("/api/consent/status").then(r=>r.json()).then(d=>{
      if(d.required){ needConsent=true; showConsentModal(); }
    }).catch(()=>{});
  }
  function showConsentModal(){
    $("consentBody").textContent = CONSENT_TEXT;
    $("consentChk").checked = false; $("consentBtn").disabled = true;
    $("consentMask").style.display = "flex";
  }
  $("consentChk").onchange = ()=>{ $("consentBtn").disabled = !$("consentChk").checked; };
  async function submitConsent(){
    try{
      const r = await apiFetch("/api/consent",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({types:"service,scope,data",channel:"web"})});
      if(!r.ok){ alert("同意提交失败，请重试"); return; }
      needConsent=false; $("consentMask").style.display="none";
    }catch(e){ alert("网络异常，请重试"); }
  }
  
  // ============ 事件委托（严格 CSP 兼容）============
  // 内联事件属性（onclick="..."）在严格 CSP（script-src nonce）下会被浏览器阻止，
  // 故统一改为 data-action + 全局事件委托：既满足 CSP 要求，又保持交互行为不变。
  (function(){
    window.__ACTIONS = window.__ACTIONS || {};
    function target(e, attr){
      return (e.target && e.target.closest) ? e.target.closest("["+attr+"]") : null;
    }
    document.addEventListener("click", function(e){
      var el = target(e, "data-action"); if(!el) return;
      var fn = window.__ACTIONS[el.getAttribute("data-action")];
      if(fn){ e.preventDefault(); fn(el, e); }
    });
    document.addEventListener("keydown", function(e){
      var el = target(e, "data-keydown-enter");
      if(!el || e.key !== "Enter" || e.shiftKey) return;
      var fn = window.__ACTIONS[el.getAttribute("data-keydown-enter")];
      if(fn){ e.preventDefault(); fn(el, e); }
    });
    document.addEventListener("input", function(e){
      var el = target(e, "data-action-input"); if(!el) return;
      var fn = window.__ACTIONS[el.getAttribute("data-action-input")];
      if(fn) fn(el, e);
    });
    document.addEventListener("change", function(e){
      var el = target(e, "data-action-change"); if(!el) return;
      var fn = window.__ACTIONS[el.getAttribute("data-action-change")];
      if(fn) fn(el, e);
    });
  })();

  // 交互动作注册表（供事件委托按 data-action 分发）
  window.__ACTIONS = Object.assign(window.__ACTIONS||{}, {
    "login": function(){ login(); },
    "show-register": function(){ showRegister(); },
    "register": function(){ register(); },
    "show-login": function(){ showLogin(); },
    "go-review": function(){ window.location="/review"; },
    "toggle-acct-menu": function(el, e){ toggleAcctMenu(e); },
    "logout": function(){ logout(); },
    "send": function(){ send(); },
    "submit-consent": function(){ submitConsent(); }
  });

  // 刷新后若本地存有账号 token，静默重登，避免每次刷新都要求重新输入密码
  (function autoResume(){
    try{
      const acc = getAccounts();
      const names = Object.keys(acc);
      if(names.length){
        const u = names[0];
        const a = acc[u];
        if(a && a.token){ enterApp(u, a.token, a.refresh||""); return; }
      }
    }catch(e){}
    openLogin();
  })();

</script>
