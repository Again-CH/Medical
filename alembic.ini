# Alembic 配置 —— 医疗预约诊疗系统 Agent
#
# 设计要点：
# - script_location 指向仓库内的 alembic/ 目录。
# - prepend_sys_path = . 使 `src` 包在 alembic 子进程/CLI 中可被导入（env.py 需要读 Base.metadata）。
# - sqlalchemy.url 留空：真正的连接串在 alembic/env.py 中从环境变量 DATABASE_URL 注入，
#   这样同一份迁移可同时跑在 sqlite（本地/测试）与 postgresql（生产）上，避免硬编码。

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
