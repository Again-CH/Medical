name: CI

# 持续集成：PR 与 main 推送时跑「能不能合」的质量门禁。
# 与 CD 的分工：CI 负责验证代码+配置+prompt 完整性；CD 负责构建与部署。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      # 1) 代码风格：ruff 失败说明代码本身不合规
      - name: Lint (ruff)
        run: ruff check src tests scripts

      # 2) 数据库迁移漂移门禁：alembic check 保证模型与迁移一致
      - name: 迁移漂移检查 (alembic check)
        env:
          MC_TEST_DB: "1"
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/medical_agent"
        run: |
          # CI 中需要真实的 pgvector；生产运行前会启动服务
          alembic check

      # 3) 快速单元测试：SQLite 模式覆盖 170+ 用例，验证业务逻辑回归
      - name: 单元测试 (pytest sqlite)
        run: python -m pytest -q

      # 4) Prompt 回归卡点：prompt 内容一旦变化，必须显式跑 --run-eval 更新 baseline
      - name: Prompt 变更检测
        run: |
          python scripts/eval_prompt_regression.py --check

      # 5) 如果 .prompt_baseline.json 也被 PR 修改，说明开发者已主动跑过 --run-eval；
      #    这里只做提醒，不阻塞（真实评测需本地 Ollama / Deepseek，GitHub Runner 无此环境）。
      - name: Prompt baseline 更新提醒
        if: failure()
        run: |
          echo "::warning:: 若 prompt 已变更，请在本地执行："
          echo "::warning::   python scripts/eval_prompt_regression.py --run-eval --backend ollama"
          echo "::warning:: 评测通过后提交 .prompt_baseline.json。"
