name: CI

# 触发：推送/PR 到主分支；也支持手动触发（Actions 页面 Run workflow）
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次运行，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ① 静态检查：ruff 保代码风格与明显错误（作为合并门禁）
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 ruff
        run: pip install "ruff==0.16.5"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  # ② 单元/端到端测试：多 Python 版本矩阵，保证兼容性
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行测试（默认 fake 模型 + 内存存储，开箱即跑）
        run: pytest -q

  # ③ 离线评测门禁：复用 tests/eval 数据集，红线/意图准确率即为守门员
  eval:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 离线评测（红线 + 意图）
        run: python scripts/eval_offline.py --out eval_report.json
      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json

  # ④ 集成测试：真实 PostgreSQL 服务容器，验证生产级持久化
  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: med_user
          POSTGRES_PASSWORD: med_pass
          POSTGRES_DB: med_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://med_user:med_pass@localhost:5432/med_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行存储集成测试（真实 Postgres）
        run: pytest tests/test_store.py -q
