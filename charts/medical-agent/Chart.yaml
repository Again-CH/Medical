apiVersion: v2
name: medical-agent
description: |
  医疗诊疗 Agent（LangGraph 中枢辐射 + HITL 审批）的 Kubernetes 部署包。
  设计要点：密钥与配置分离（Secret / ConfigMap），启动时强校验（缺失即拒绝
