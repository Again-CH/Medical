type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - medical
  - agent
  - langgraph
  - hitl
home: https://github.com/example/medical-agent
sources:
  - https://github.com/example/medical-agent
maintainers:
  - name: platform-team
