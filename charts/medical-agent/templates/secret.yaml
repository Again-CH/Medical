{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medical-agent.fullname" . }}-secrets
  labels:
    {{- include "medical-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.data.databaseUrl | quote }}
  jwt-secret: {{ .Values.secrets.data.jwtSecret | quote }}
  admin-api-key: {{ .Values.secrets.data.adminApiKey | quote }}
  cors-origins: {{ .Values.secrets.data.corsOrigins | quote }}
{{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medical-agent.fullname" . }}-postgresql-secret
  labels:
    {{- include "medical-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # demo 用；生产必须由 External Secrets / SealedSecrets 注入。
  # 缺失即 helm 模板化失败（不允许弱口令默认值）。
  postgres-password: {{ required "postgresql.auth.password 必须显式设置（生产用 External Secrets 注入）" .Values.postgresql.auth.password | quote }}
{{- end }}
