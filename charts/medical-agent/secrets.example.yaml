# 示例 Secret 清单（切勿提交真实值！）。
# 用法：复制为 secrets.yaml 填入真实值后 `kubectl apply -f secrets.yaml`，
# 或直接用 scripts/gen-secrets.sh 随机生成。
# 生产强烈建议改用 SealedSecrets / External Secrets Operator，让密钥永不进 Git。
apiVersion: v1
kind: Secret
metadata:
  name: medical-agent-secrets
  namespace: medical-agent
type: Opaque
stringData:
  # 完整连接串（应用读 DATABASE_URL）。生产指向托管 RDS/PolarDB。
  database-url: "postgresql+psycopg2://med_user:CHANGE_ME@postgresql:5432/med_agent"
  # 至少 32 字节；缺失或不足长会触发启动期强校验拒绝启动
  jwt-secret: "CHANGE_ME_32_plus_bytes_base64"
  # 管理员密钥（X-Admin-Key / Authorization: Bearer 双通道）
  admin-api-key: "CHANGE_ME_base64"
  # 生产前端域名（逗号分隔）；strict 下禁止 "*"
  cors-origins: "https://your-domain.com"
