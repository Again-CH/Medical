# 一键拉起本地可观测性栈：Prometheus + Grafana + Alertmanager。
# 用法：
#   cd observability
#   echo "你的ADMIN_API_KEY" > prometheus/admin_key   # 必须，否则 /metrics 抓取被拒
#   docker compose up -d
# 然后访问：
#   Prometheus  http://localhost:9090   （看指标 / 验证告警）
#   Grafana     http://localhost:3000   （admin / admin，已自动导入医疗 Agent 面板）
#   Alertmanager http://localhost:9093
#   Alert Sink  http://localhost:9101/health （本地告警接收端，见下方说明）
#
# 验证告警闭环（告警是否真的发出去了）：
#   curl -XPOST http://localhost:9093/api/v2/alerts -H 'Content-Type: application/json' -d '[
#     {"labels":{"alertname":"SmokeTest","severity":"critical","instance":"local"},
#      "annotations":{"summary":"告警闭环冒烟测试"}}]'
#   docker compose logs -f alert-sink      # 应看到可读摘要
#   cat alert-sink-data/alerts.jsonl       # 应多出一行 JSON
services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    depends_on:
      - alert-sink
    restart: unless-stopped

  # 本地告警接收端：把 Alertmanager 的 webhook 真正落地，让"可观测"变成"可验证"。
  # 生产请改用 alertmanager.production.yml（url_file 引用企业 IM 密钥），
  # 本服务仅用于本地闭环验证，纯标准库实现，无需构建镜像、无额外依赖。
  alert-sink:
    image: python:3.12-alpine
    working_dir: /app
    ports:
      - "9101:9101"
    volumes:
      - ../scripts:/app/scripts:ro
      - ./alert-sink-data:/data
    command:
      - python
      - -u
      - scripts/alert_sink.py
      - --host
      - "0.0.0.0"
      - --port
      - "9101"
      - --log
      - /data/alerts.jsonl
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:9101/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
