# Prometheus 抓取配置：抓取医疗 Agent 的 /metrics 端点。
#
# 鉴权说明
# --------
# 应用 /metrics 默认需管理员密钥。Prometheus 无法发送任意自定义请求头，
# 但原生支持 `authorization.credentials_file`——把同一把 ADMIN_API_KEY 写入
# `admin_key` 文件（本文件已 gitignore），Prometheus 以 Bearer 形式携带，
# 即可安全抓取，无需为抓取把 METRICS_PUBLIC 设为公开。
#
# 抓取目标
# --------
# 应用在本机 8000 端口。Docker 容器内用 host.docker.internal 访问宿主机；
# 若 Prometheus 与应用同网络（compose 默认），可改为 `medical-agent:8000`。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: medical-agent-local

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: medical-agent
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/admin_key
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: medical-agent
